<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>J.C. High Solution Engineering | Prozessautomatisierung für SHK-Betriebe</title>
<style>
:root {
--bg: #0b0f17;
--surface: #131a26;
--surface-2: #1a2434;
--text: #f3f6fa;
--muted: #9fb0c7;
--accent: #38bdf8;
--accent-2: #22c55e;
--border: #263347;
}

* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
background: var(--bg);
color: var(--text);
line-height: 1.6;
padding: 24px 16px 64px;
}

.container {
max-width: 980px;
margin: 0 auto;
}

header {
background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
border: 1px solid var(--border);
border-radius: 16px;
padding: 32px 24px;
margin-bottom: 28px;
}

.badge {
display: inline-block;
background: rgba(56, 189, 248, 0.14);
color: var(--accent);
border: 1px solid rgba(56, 189, 248, 0.35);
font-size: 0.8rem;
font-weight: 700;
letter-spacing: 0.04em;
text-transform: uppercase;
padding: 5px 10px;
border-radius: 999px;
margin-bottom: 14px;
}

h1 {
font-size: clamp(1.65rem, 4vw, 2.4rem);
line-height: 1.2;
margin-bottom: 12px;
}

.lead {
color: var(--muted);
font-size: 1.05rem;
max-width: 72ch;
margin-bottom: 20px;
}

.cta-row {
display: flex;
flex-wrap: wrap;
gap: 12px;
}

.btn {
display: inline-block;
text-decoration: none;
font-weight: 700;
padding: 12px 18px;
border-radius: 10px;
transition: transform 0.15s ease, opacity 0.15s ease;
}

.btn:hover {
transform: translateY(-1px);
opacity: 0.95;
}

.btn-primary {
background: var(--accent);
color: #061018;
}

.btn-secondary {
background: var(--surface);
color: var(--text);
border: 1px solid var(--border);
}

h2 {
font-size: 1.45rem;
margin: 32px 0 14px;
}

.packages {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
gap: 18px;
}

.card {
background: var(--surface);
border: 1px solid var(--border);
border-radius: 14px;
padding: 22px;
display: flex;
flex-direction: column;
justify-content: space-between;
}

.card.featured {
border-color: var(--accent);
box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.25);
}

.pkg-name {
font-size: 1.1rem;
font-weight: 700;
margin-bottom: 6px;
}

.price {
font-size: 1.9rem;
font-weight: 800;
color: var(--accent);
margin-bottom: 12px;
}

.card p {
color: var(--muted);
font-size: 0.95rem;
margin-bottom: 14px;
}

ul {
list-style: none;
margin-bottom: 18px;
}

ul li {
position: relative;
padding-left: 20px;
margin-bottom: 8px;
font-size: 0.93rem;
color: var(--text);
}

ul li::before {
content: "✓";
position: absolute;
left: 0;
color: var(--accent-2);
font-weight: 700;
}

.info-box {
background: var(--surface);
border: 1px solid var(--border);
border-radius: 14px;
padding: 22px;
margin-top: 24px;
}

.info-box p {
color: var(--muted);
margin-bottom: 10px;
}

a {
color: var(--accent);
}

footer {
margin-top: 36px;
padding-top: 20px;
border-top: 1px solid var(--border);
color: var(--muted);
font-size: 0.88rem;
display: flex;
flex-wrap: wrap;
justify-content: space-between;
gap: 12px;
}
</style>
</head>
